# This workflow queries top names from a public dataset in BigQuery
# and writes the results to a Google Sheets spreadsheet.

# [START workflows_sheets_compute]
main:
   params: [input]
   steps:
   - init:
       assign:
            - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
            - zone: ${input.zone}
            - machineType: ${input.machineType}
            - diskSize: ${input.diskSize}
            - imageFamily: ${input.imageFamily}
            - vmName: ${input.vmName}
            - email: ${input.email}
            - allowedZones:
                - "us-central1-a"
                - "us-central1-b"
                - "us-central1-c"
                - "us-central1-f"
            - allowedMachineTypes:
                - "e2-micro"
                - "e2-small"
                - "e2-medium"
                - "e2-standard-2"
                - "e2-standard-4"
            - allowedImages:
                debian-10: "debian-cloud"
                centos-stream-9: "centos-cloud"
                cos-93-lts: "cos-cloud"
                cos-97-lts: "cos-cloud"
   - validateInput:
       switch:
            - condition: ${not(zone in allowedZones)}
              steps:
                - invalidZone:
                    raise: '${"Invalid zone: " + zone}'
            - condition: ${not(machineType in allowedMachineTypes)}
              steps:
                - invalidMachineType:
                    raise: '${"Invalid machineType: " + machineType}'
            - condition: ${not(imageFamily in keys(allowedImages))}
              steps:
                - invalidImageFamily:
                    raise: '${"Invalid imageFamily: " + imageFamily}'
            - condition: ${int(diskSize) < 1 or int(diskSize) > 100}
              steps:
                - invalidDiskSize:
                    raise: '${"Invalid diskSize: " + string(diskSize)}'
            - condition: ${not(text.match_regex(vmName, "^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$"))}
              steps:
                - invalidVmName:
                    raise: '${"Invalid vmName: " + vmName}'
   - createResource:
       call: googleapis.compute.v1.instances.insert
       args:
           project: ${projectId}
           zone: ${zone}
           body:
               name: ${vmName}
               machineType: ${"projects/" + projectId + "/zones/" + zone + "/machineTypes/" + machineType}
               disks:
                - initializeParams:
                    diskSizeGb: ${int(diskSize)}
                    sourceImage: ${"projects/" + allowedImages[imageFamily] + "/global/images/family/" + imageFamily}
                  type: PERSISTENT
                  boot: true
                  autoDelete: true
               networkInterfaces:
                - network: "global/networks/default"
       result: insertResult
   - retStep:
       return: ${insertResult}
# [END workflows_sheets_compute]
